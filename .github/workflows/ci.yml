name: CI
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy schemashift
      - run: python -m schemashift.equivalence.rules_doc --check
      - run: >
          pytest
          --cov=schemashift.parser --cov=schemashift.semantic --cov=schemashift.ir
          --cov=schemashift.equivalence --cov=schemashift.optimizer --cov=schemashift.codegen
          --cov-fail-under=85
      - run: python -m schemashift.cli evaluate

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
