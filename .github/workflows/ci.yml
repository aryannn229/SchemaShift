name: CI
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy schemashift
      - run: python -m schemashift.equivalence.rules_doc --check
      - run: >
          pytest
          --cov=schemashift.parser --cov=schemashift.semantic --cov=schemashift.ir
          --cov=schemashift.equivalence --cov=schemashift.optimizer --cov=schemashift.codegen
          --cov-fail-under=85
      - run: python -m schemashift.cli evaluate

  openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pip install -e backend
      - run: python scripts/gen_openapi.py
      - run: npm ci && npm run gen:api
        working-directory: frontend
      - name: Fail if the committed OpenAPI schema or TS client is stale
        run: git diff --exit-code frontend/openapi.json frontend/src/api/schema.d.ts

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  integration:
    runs-on: ubuntu-latest
    needs: backend
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Start PostgreSQL 16 and MongoDB 7 (replica set)
        run: docker compose -f ../docker-compose.test.yml up -d --wait
      - run: pytest -m integration

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -e "backend[dev]"
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Start API and web server
        run: |
          (cd backend && nohup uvicorn schemashift.api.main:app --port 8000 > ../api.log 2>&1 &)
          (cd frontend && nohup npm run dev > ../web.log 2>&1 &)
          npx --yes wait-on http://localhost:8000/api/v1/health http://localhost:5173
        working-directory: frontend
      - run: npx playwright test
        working-directory: frontend

  docker:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [backend, frontend, integration]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/backend:latest
            ghcr.io/${{ github.repository }}/backend:${{ github.sha }}
