name: CI
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy schemashift
      - run: python -m schemashift.equivalence.rules_doc --check
      - run: >
          pytest
          --cov=schemashift.parser --cov=schemashift.semantic --cov=schemashift.ir
          --cov=schemashift.equivalence --cov=schemashift.optimizer --cov=schemashift.codegen
          --cov-fail-under=85
      - run: python -m schemashift.cli evaluate

  openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pip install -e backend
      - run: python scripts/gen_openapi.py
      - run: npm ci && npm run gen:api
        working-directory: frontend
      - name: Fail if the committed OpenAPI schema or TS client is stale
        run: git diff --exit-code frontend/openapi.json frontend/src/api/schema.d.ts

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  integration:
    runs-on: ubuntu-latest
    needs: backend
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Start PostgreSQL 16 and MongoDB 7 (replica set)
        run: |
          docker compose -f ../docker-compose.test.yml up -d --wait postgres mongo
          docker compose -f ../docker-compose.test.yml run --rm mongo-init
          until docker compose -f ../docker-compose.test.yml exec -T mongo mongosh --quiet --eval 'rs.status().myState' | grep -q '^1$'; do sleep 2; done
      - run: pytest -m integration

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -e "backend[dev]"
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Start PostgreSQL 16 and MongoDB 7 (replica set)
        run: |
          docker compose -f docker-compose.test.yml up -d --wait postgres mongo
          docker compose -f docker-compose.test.yml run --rm mongo-init
          until docker compose -f docker-compose.test.yml exec -T mongo mongosh --quiet --eval 'rs.status().myState' | grep -q '^1$'; do sleep 2; done
      - name: Start API and web server
        env:
          SANDBOX_ADMIN_DATABASE_URL: postgresql://test:test@localhost:5433/test
          MONGO_URL: mongodb://localhost:27018/?directConnection=true
          COMPILE_RATE_PER_MINUTE: "1000"   # the end-to-end run compiles far more than 30 times a minute
          VERIFY_RATE_PER_MINUTE: "100"
        run: |
          (cd backend && nohup uvicorn schemashift.api.main:app --port 8000 > ../api.log 2>&1 &)
          (cd frontend && VITE_PROXY_TARGET=http://127.0.0.1:8000 nohup npm run dev -- --host 127.0.0.1 > ../web.log 2>&1 &)
          npx --yes wait-on -t 90000 http-get://127.0.0.1:8000/api/v1/health http-get://127.0.0.1:5173
        timeout-minutes: 5
      - name: Show server logs on failure
        if: failure()
        run: tail -n 50 api.log web.log
      - run: npx playwright test --reporter=github,list
        working-directory: frontend
        env:
          E2E_BASE_URL: http://127.0.0.1:5173
          E2E_VERIFY: "1"

  prod-stack:
    # the deployment configuration, exercised locally: same image and commands as Render, plus Redis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f docker-compose.prod.yml up -d --build --wait
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/smoke_test.py http://localhost:8010 --origin http://localhost:5173 --verify --wait 120
      - if: failure()
        run: docker compose -f docker-compose.prod.yml logs --tail=100
      - if: always()
        run: docker compose -f docker-compose.prod.yml down -v

  docker:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [backend, frontend, integration, prod-stack]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Lowercase image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/backend" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
