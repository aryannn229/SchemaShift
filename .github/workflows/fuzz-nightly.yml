name: Fuzz (nightly)
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      cases:
        description: Number of generated cases
        default: "1000"
      seed:
        description: Hypothesis seed (empty = day of year)
        default: ""

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Start PostgreSQL 16 and MongoDB 7 (replica set)
        run: |
          docker compose -f ../docker-compose.test.yml up -d --wait postgres mongo
          docker compose -f ../docker-compose.test.yml run --rm mongo-init
          until docker compose -f ../docker-compose.test.yml exec -T mongo mongosh --quiet --eval 'rs.status().myState' | grep -q '^1$'; do sleep 2; done
      - name: Differential + metamorphic fuzzing
        env:
          SANDBOX_ADMIN_DATABASE_URL: postgresql://test:test@localhost:5433/test
          MONGO_URL: mongodb://localhost:27018/?directConnection=true
          CASES: ${{ github.event.inputs.cases || '1000' }}
          SEED_IN: ${{ github.event.inputs.seed }}
        run: |
          SEED=${SEED_IN:-$(date +%j)}
          echo "seed=$SEED cases=$CASES" | tee -a "$GITHUB_STEP_SUMMARY"
          python -m schemashift.cli fuzz --cases "$CASES" --seed "$SEED" --metamorphic \
            --save-dir fuzz-out | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload new minimal reproducers
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-reproducers
          path: backend/fuzz-out/*.yaml
          if-no-files-found: ignore
