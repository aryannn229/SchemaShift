services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-schemashift}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-schemashift_app}
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-schemashift}"]
      interval: 5s
      retries: 10

  mongo:
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports: ["${MONGO_PORT:-27017}:27017"]
    volumes: [mongodata:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      retries: 10

  mongo-init:
    image: mongo:7
    depends_on:
      mongo: { condition: service_healthy }
    restart: "no"
    entrypoint:
      - mongosh
      - --host
      - mongo
      - --quiet
      - --eval
      - "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0', members:[{_id:0, host:'localhost:27017'}]}) }"

  backend:
    build: ./backend
    command: ["uvicorn", "schemashift.api.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    environment:
      APP_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-schemashift}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-schemashift_app}
      MONGO_URL: mongodb://mongo:27017/?directConnection=true
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    volumes: ["./backend/schemashift:/app/schemashift"]
    ports: ["${BACKEND_PORT:-8000}:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      mongo-init: { condition: service_completed_successfully }

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    volumes: ["./frontend:/app"]
    ports: ["${FRONTEND_PORT:-5173}:5173"]

volumes:
  pgdata:
  mongodata:
