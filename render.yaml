services:
  - type: web
    name: schemashift-api
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_DATABASE_URL
        sync: false
      - key: SANDBOX_ADMIN_DATABASE_URL
        sync: false
      - key: MONGO_URL
        sync: false
      - key: MONGO_SANDBOX_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
