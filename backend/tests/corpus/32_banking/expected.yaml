  fk:cards.account_id->accounts.id: EMBED
  m2n:beneficiaries: REF_ARRAY
diagnostics: []
bulk:
- match: type:*
  status: SAFE
  why: plain types map to exact BSON types
- match: not_null:*
  status: SAFE
  why: NOT NULL maps to $jsonSchema required
- match: pk:*
  status: SAFE
  why: primary key becomes _id or a unique index
- match: auto_increment:*
  status: CHANGED
  why: SERIAL/IDENTITY becomes ObjectId
- match: restrict_delete:*
  status: CHANGED
  why: RESTRICT/NO ACTION must be checked in the app (or children vanish when embedded)
