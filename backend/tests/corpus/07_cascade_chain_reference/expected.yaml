description: two-hop cascade, everything by reference
diagnostics: []
bulk:
- match: type:*
  status: SAFE
  why: plain types map to exact BSON types
- match: not_null:*
  status: SAFE
  why: NOT NULL maps to $jsonSchema required
verdicts:
  pk:a.id:
    status: SAFE
    why: _id
  pk:b.id:
    status: SAFE
    why: _id
  pk:c.id:
    status: SAFE
    why: _id
  fk:b.a_id->a.id:
    status: CHANGED
    why: no foreign keys
  fk:c.b_id->b.id:
    status: CHANGED
    why: no foreign keys
  cascade_delete:b.a_id->a.id:
    status: BROKEN
    why: no native cascade; chain a->b->c leaves orphans
  cascade_delete:c.b_id->b.id:
    status: BROKEN
    why: no native cascade
