  why: NOT NULL maps to $jsonSchema required
verdicts:
  pk:p.id:
    status: SAFE
    why: _id
  pk:c1.id:
    status: SAFE
    why: _id
  pk:c2.id:
    status: SAFE
    why: _id
  pk:c3.id:
    status: CHANGED
    why: embedded array element
  unique:p.code:
    status: SAFE
    why: NOT NULL unique index
  fk:c1.p_id->p.id:
    status: CHANGED
    why: no foreign keys
  fk:c2.p_code->p.code:
    status: CHANGED
    why: no foreign keys
  fk:c3.p_id->p.id:
    status: SAFE
    why: embedded
  restrict_delete:c1.p_id->p.id:
    status: CHANGED
    why: app must check
  restrict_delete:c2.p_code->p.code:
    status: CHANGED
    why: app must check
  restrict_delete:c3.p_id->p.id:
    status: CHANGED
