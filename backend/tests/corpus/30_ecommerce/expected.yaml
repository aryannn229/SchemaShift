description: 'e-commerce: 9 tables, embedded items/payments/addresses'
placements:
  fk:addresses.customer_id->customers.id: EMBED
  fk:order_items.order_id->orders.id: EMBED
  fk:payments.order_id->orders.id: EMBED
diagnostics:
- SEM011
bulk:
- match: type:*
  status: SAFE
  why: plain types map to exact BSON types
- match: not_null:*
  status: SAFE
  why: NOT NULL maps to $jsonSchema required
- match: pk:*
  status: SAFE
  why: primary key becomes _id or a unique index
- match: auto_increment:*
  status: CHANGED
  why: SERIAL/IDENTITY becomes ObjectId
- match: restrict_delete:*
  status: CHANGED
  why: RESTRICT/NO ACTION must be checked in the app (or children vanish when embedded)
