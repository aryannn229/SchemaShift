summary: 'different row counts: a join or filter treats NULL / missing values differently'
schema_sql: "CREATE TYPE mood AS ENUM ('draft', 'open', 'closed');\nCREATE TABLE t0\
  \ (\n  id SERIAL,\n  c0 TEXT NOT NULL UNIQUE DEFAULT 'd',\n  c1 INTEGER NOT NULL\
  \ UNIQUE DEFAULT 0 CHECK (c1 >= -2147483648),\n  f0 INTEGER,\n  f1 INTEGER,\n  PRIMARY\
  \ KEY (id),\n  FOREIGN KEY (f0) REFERENCES t0(id)\n);\nCREATE TABLE t1 (\n  id SERIAL,\n\
  \  c0 TEXT NOT NULL UNIQUE DEFAULT 'd',\n  c1 TEXT NOT NULL UNIQUE DEFAULT 'd',\n\
  \  f0 INTEGER,\n  f1 INTEGER,\n  PRIMARY KEY (id),\n  FOREIGN KEY (f0) REFERENCES\
  \ t1(id)\n);\nCREATE TABLE t2 (\n  id SERIAL,\n  c0 TEXT NOT NULL UNIQUE DEFAULT\
  \ 'd',\n  c1 TEXT NOT NULL UNIQUE DEFAULT 'd',\n  c2 INTEGER NOT NULL UNIQUE DEFAULT\
  \ 0 CHECK (c2 >= -2147483648),\n  c3 TEXT NOT NULL UNIQUE DEFAULT 'd',\n  PRIMARY\
  \ KEY (id)\n);\nALTER TABLE t0 ADD CONSTRAINT fk_t0_f1 FOREIGN KEY (f1) REFERENCES\
  \ t1(id);\nALTER TABLE t1 ADD CONSTRAINT fk_t1_f1 FOREIGN KEY (f1) REFERENCES t2(id);\n"
seed_sql: 'INSERT INTO t0 (id, c0, c1, f0, f1) VALUES (1, '''', 0, NULL, NULL);

  INSERT INTO t2 (id, c0, c1, c2, c3) VALUES (1, '''', '''', 0, '''');

  '
queries:
- SELECT a0.id AS c0, a1.id AS c1, a2.id AS c2 FROM t2 a0 LEFT JOIN t1 a1 ON a0.id
