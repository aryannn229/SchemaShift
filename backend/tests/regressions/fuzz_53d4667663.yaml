  INSERT INTO t0 (id, c0, c1, c2, f0) VALUES (2, NULL, ''draft'', NULL, 1);

  INSERT INTO t0 (id, c0, c1, c2, f0) VALUES (3, NULL, NULL, NULL, 1);

  '
queries:
- SELECT a0.c0 AS c0, a0.c1 AS c1, COUNT(*) AS c2 FROM t0 a0 GROUP BY a0.c0, a0.c1
