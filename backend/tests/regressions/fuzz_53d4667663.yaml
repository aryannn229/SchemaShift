summary: 'same rows, different order: NULL placement or the ORDER BY keys differ'
schema_sql: "CREATE TYPE mood AS ENUM ('draft', 'open', 'closed');\nCREATE TABLE t0\
  \ (\n  id SERIAL,\n  c0 TEXT UNIQUE DEFAULT 'd',\n  c1 mood,\n  c2 TEXT UNIQUE DEFAULT\
  \ 'd',\n  f0 INTEGER,\n  PRIMARY KEY (id),\n  FOREIGN KEY (f0) REFERENCES t0(id)\n\
  );\n"
