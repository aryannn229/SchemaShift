note: PostgreSQL's libc collation ignores punctuation/spaces at the first comparison
  level ('a%' sorts before 'A'); the ICU 'en' collation used for MongoDB does not.
  Equality stays exact, ordering of strings that differ only in punctuation can differ.
  Use string_collation='binary' with a C-collated PostgreSQL database for exact agreement.
  The fuzzer's text pool excludes punctuation.
