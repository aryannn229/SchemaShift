# Embed-vs-reference cost model weights. Every number here is tunable; see docs/OPTIMIZER.md.
threshold: 0.5            # embed when the normalized score is >= threshold

hard:
  max_parent_doc_bytes: 4194304   # 4 MB safe ceiling (MongoDB's hard limit is 16 MB)
  safety_factor: 2                # projected size = parent + children * child_size * factor
  max_children_per_parent: 1000   # above this a parent array is treated as unbounded
  small_children: 50              # "small" 1:N fan-out for the shape bonus
  max_embed_depth: 3              # nested embedding depth limit

soft:                             # weighted sum; negative weights penalise embedding
  read_together: 0.30
  shape: 0.20
  guarantees: 0.20
  independent_access: -0.20
  write_frequency: -0.10

workload:                         # Phase 18: only active when a workload or seed statistics are supplied
  parent_write_amplification: -0.15   # parent write share x (embedded children bytes / doc_budget_bytes)
  child_write_share: -0.10             # frequency-weighted share of the workload that writes the child
  fanout_skew: -0.10                  # (max - avg) / avg fan-out, saturating at skew_scale
  doc_budget_bytes: 262144
  skew_scale: 10

shape:
  one_to_one: 1.0
  one_to_many_small: 0.6
  other: 0.0

write_norm:
  low: 0.0
  med: 0.5
  high: 1.0

defaults:
  child_independent_access: 0.3
  read_together_ratio: 0.5
  child_write_frequency: med
  children_per_parent_one_to_one: 1
  children_per_parent_one_to_many: 20
