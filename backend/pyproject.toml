[project]
name = "schemashift"
version = "0.1.0"
description = "SQL to MongoDB migration compiler with semantic equivalence checking"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlglot>=25",
  "networkx>=3.3",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "pymongo>=4.8",
  "structlog>=24.1",
  "typer>=0.12",
  "pyyaml>=6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8", "pytest-cov>=5", "hypothesis>=6", "httpx>=0.27",
  "ruff>=0.5", "mypy>=1.10", "types-PyYAML", "types-networkx", "testcontainers>=4",
]

[project.scripts]
schemashift = "schemashift.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["schemashift*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs docker services", "live: needs real LLM key"]
addopts = "-m \"not integration and not live\""

[tool.coverage.run]
source = ["schemashift"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"schemashift/api/routes/*" = ["B008"]
"tests/*" = ["E501"]

[tool.mypy]
strict = true
python_version = "3.11"
plugins = ["pydantic.mypy"]
